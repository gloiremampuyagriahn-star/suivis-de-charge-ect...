{% extends "base.html" %}

{% block title %}Modifier une Assemblée - Gestion Copropriété{% endblock %}

{% block content %}
<div class="header">
    <h1>Modifier l'Assemblée Générale</h1>
</div>

<div class="content">
    <form method="POST">
        <div class="form-group">
            <label for="titre">Titre:</label>
            <input type="text" id="titre" name="titre" value="{{ assemblee.titre }}" required>
        </div>
        
        <div class="form-group">
            <label for="date_seance">Date et Heure:</label>
            <input type="datetime-local" id="date_seance" name="date_seance" value="{{ assemblee.date_seance.strftime('%Y-%m-%dT%H:%M') }}" required>
        </div>
        
        <div class="form-group">
            <label for="lieu">Lieu:</label>
            <input type="text" id="lieu" name="lieu" value="{{ assemblee.lieu or '' }}">
        </div>
        
        <div class="form-group">
            <label for="ordre_du_jour">Ordre du Jour:</label>
            <textarea id="ordre_du_jour" name="ordre_du_jour" required>{{ assemblee.ordre_du_jour }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="proces_verbal">Procès-Verbal:</label>
            <textarea id="proces_verbal" name="proces_verbal">{{ assemblee.proces_verbal or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="statut">Statut:</label>
            <select id="statut" name="statut">
                <option value="programmée" {% if assemblee.statut == 'programmée' %}selected{% endif %}>Programmée</option>
                <option value="effectuée" {% if assemblee.statut == 'effectuée' %}selected{% endif %}>Effectuée</option>
            </select>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-success">Mettre à Jour</button>
            <a href="{{ url_for('assemblees.liste_assemblees') }}" class="btn btn-primary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
