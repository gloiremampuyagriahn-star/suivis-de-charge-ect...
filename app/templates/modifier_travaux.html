{% extends "base.html" %}

{% block title %}Modifier des Travaux - Gestion Copropriété{% endblock %}

{% block content %}
<div class="header">
    <h1>Modifier les Travaux</h1>
</div>

<div class="content">
    <form method="POST">
        <div class="form-group">
            <label for="titre">Titre:</label>
            <input type="text" id="titre" name="titre" value="{{ travaux.titre }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" required>{{ travaux.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="type_travaux">Type de Travaux:</label>
            <select id="type_travaux" name="type_travaux" required>
                <option value="maintenance" {% if travaux.type_travaux == 'maintenance' %}selected{% endif %}>Maintenance</option>
                <option value="rénovation" {% if travaux.type_travaux == 'rénovation' %}selected{% endif %}>Rénovation</option>
                <option value="urgence" {% if travaux.type_travaux == 'urgence' %}selected{% endif %}>Urgence</option>
                <option value="amélioration" {% if travaux.type_travaux == 'amélioration' %}selected{% endif %}>Amélioration</option>
                <option value="contrôle" {% if travaux.type_travaux == 'contrôle' %}selected{% endif %}>Contrôle</option>
                <option value="autre" {% if travaux.type_travaux == 'autre' %}selected{% endif %}>Autre</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="date_debut">Date de Début:</label>
            <input type="datetime-local" id="date_debut" name="date_debut" value="{{ travaux.date_debut.strftime('%Y-%m-%dT%H:%M') }}" required>
        </div>
        
        <div class="form-group">
            <label for="date_fin_prevue">Date de Fin Prévue:</label>
            <input type="datetime-local" id="date_fin_prevue" name="date_fin_prevue" value="{{ travaux.date_fin_prevue.strftime('%Y-%m-%dT%H:%M') if travaux.date_fin_prevue else '' }}">
        </div>
        
        <div class="form-group">
            <label for="date_fin_reelle">Date de Fin Réelle:</label>
            <input type="datetime-local" id="date_fin_reelle" name="date_fin_reelle" value="{{ travaux.date_fin_reelle.strftime('%Y-%m-%dT%H:%M') if travaux.date_fin_reelle else '' }}">
        </div>
        
        <div class="form-group">
            <label for="budget_previsionnel">Budget Prévisionnel (€):</label>
            <input type="number" id="budget_previsionnel" name="budget_previsionnel" value="{{ travaux.budget_previsionnel or '' }}" step="0.01">
        </div>
        
        <div class="form-group">
            <label for="budget_reel">Budget Réel (€):</label>
            <input type="number" id="budget_reel" name="budget_reel" value="{{ travaux.budget_reel or '' }}" step="0.01">
        </div>
        
        <div class="form-group">
            <label for="responsable">Responsable:</label>
            <input type="text" id="responsable" name="responsable" value="{{ travaux.responsable or '' }}">
        </div>
        
        <div class="form-group">
            <label for="entreprise">Entreprise:</label>
            <input type="text" id="entreprise" name="entreprise" value="{{ travaux.entreprise or '' }}">
        </div>
        
        <div class="form-group">
            <label for="contact_entreprise">Contact Entreprise:</label>
            <input type="text" id="contact_entreprise" name="contact_entreprise" value="{{ travaux.contact_entreprise or '' }}">
        </div>
        
        <div class="form-group">
            <label for="statut">Statut:</label>
            <select id="statut" name="statut">
                <option value="planifié" {% if travaux.statut == 'planifié' %}selected{% endif %}>Planifié</option>
                <option value="en cours" {% if travaux.statut == 'en cours' %}selected{% endif %}>En cours</option>
                <option value="terminé" {% if travaux.statut == 'terminé' %}selected{% endif %}>Terminé</option>
                <option value="suspendu" {% if travaux.statut == 'suspendu' %}selected{% endif %}>Suspendu</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="appel_offres">Appel d'Offres:</label>
            <textarea id="appel_offres" name="appel_offres">{{ travaux.appel_offres or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="devis">Devis:</label>
            <textarea id="devis" name="devis">{{ travaux.devis or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes">{{ travaux.notes or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn btn-success">Mettre à Jour</button>
            <a href="{{ url_for('travaux.liste_travaux') }}" class="btn btn-primary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
